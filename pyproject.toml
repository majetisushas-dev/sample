[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="ecsc-rag"
version="0.1.0"
requires-python=">=3.11"
dependencies=["numpy>=2","pandas>=2","scipy>=1.12","scikit-learn>=1.4","joblib>=1.3","PyYAML>=6","matplotlib>=3.8"]
[project.optional-dependencies]
demo=["streamlit>=1.35"]
dev=["pytest>=8","python-pptx>=1.0","reportlab>=4"]
[tool.setuptools.packages.find]
where=["src"]
[tool.pytest.ini_options]
pythonpath=["src"]

